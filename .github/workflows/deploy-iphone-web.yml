
name: Kruchyx v0.9.6 - iPhone Web App (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/deploy-iphone-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Zbuduj wersje web na iPhone
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Zbuduj aplikacje web
        working-directory: mobile/kruchyx_mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=web --org com.kruchyx .
          flutter pub get
          flutter test
          flutter build web --release --base-href "/Kruchyx-Mobile_Medieval2TotalWar/"
          touch build/web/.nojekyll

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5

      - name: Udostepnij pliki
        uses: actions/upload-pages-artifact@v4
        with:
          path: mobile/kruchyx_mobile/build/web

  deploy:
    name: Opublikuj aplikacje
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Wdroz aplikacje
        id: deployment
        uses: actions/deploy-pages@v4
