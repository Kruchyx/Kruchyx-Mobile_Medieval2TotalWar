
name: Kruchyx Mobile - Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'

      - name: Zbuduj APK
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="$(dirname "$(find . -maxdepth 3 -name pubspec.yaml -print -quit)")"
          test -f "$APP_DIR/pubspec.yaml" || { echo "Nie znaleziono pubspec.yaml"; exit 1; }
          cd "$APP_DIR"
          flutter create --platforms=android --org com.kruchyx .
          flutter pub get
          flutter build apk --release
          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/apk/Kruchyx-Mobile-v0.9.5.apk"

      - name: Udostepnij APK
        uses: actions/upload-artifact@v4
        with:
          name: Kruchyx-Mobile-v0.9.5-APK
          path: apk/Kruchyx-Mobile-v0.9.5.apk
          if-no-files-found: error
