name: Kruchyx v0.9.6 - Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Kompiluj Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK - poprawiona wersja v4
        uses: android-actions/setup-android@v4
      - name: Flutter 3.47.8
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - name: Przygotuj Android i zainstaluj zależności
        working-directory: mobile/kruchyx_mobile
        run: |
          flutter create --platforms=android --org com.kruchyx .
          flutter pub get
      - name: Testy Flutter
        working-directory: mobile/kruchyx_mobile
        run: flutter test
      - name: Zbuduj APK
        working-directory: mobile/kruchyx_mobile
        run: flutter build apk --release
      - name: Sprawdź i nazwij plik APK
        shell: bash
        run: |
          set -euo pipefail
          test -s mobile/kruchyx_mobile/build/app/outputs/flutter-apk/app-release.apk
          mkdir -p artifacts/android
          cp mobile/kruchyx_mobile/build/app/outputs/flutter-apk/app-release.apk artifacts/android/Kruchyx-Mobile-v0.9.6.apk
      - name: APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Kruchyx-Android-v0.9.6-APK
          path: artifacts/android/Kruchyx-Mobile-v0.9.6.apk
          if-no-files-found: error
